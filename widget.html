<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; user-select: none; }
  #pill {
    position: absolute; inset: 3px;
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: rgba(13, 18, 26, .62);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 20px;
    backdrop-filter: blur(9px);
    cursor: default;
  }
  #pill:hover { background: rgba(13, 18, 26, .78); border-color: rgba(255,255,255,.18); }
  #pill.codex { background: rgba(8, 35, 33, .86); border-color: rgba(94,234,212,.45); border-radius: 10px; }
  #provider { font-size: 8px; font-weight: 700; color: #93c5fd; letter-spacing: .6px; }
  #pill.codex #provider { color: #5eead4; }
  #label {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: rgba(230, 237, 243, .8); white-space: nowrap; max-width: 46%;
    overflow: hidden; text-overflow: ellipsis;
  }
  #track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; min-width: 30px; }
  #fill { height: 100%; border-radius: 3px; width: 0%; transition: width .7s cubic-bezier(.22,1,.36,1); background: #3b82f6; }
  #pct { font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #grip {
    position: absolute; right: 3px; top: 3px; bottom: 3px; width: 14px;
    border-radius: 0 20px 20px 0; display: flex; align-items: center; justify-content: center;
    color: transparent; font-size: 9px;
  }
  #pill:hover #grip { color: rgba(255,255,255,.4); }
  #topBadge {
    position: absolute; left: 10px; top: -1px; font-size: 8px; color: rgba(96,165,250,.9);
    display: none;
  }
</style>
</head>
<body>
<div id="pill">
  <span id="topBadge">📍</span>
  <span id="provider"></span><span id="label">…</span>
  <div id="track"><div id="fill"></div></div>
  <span id="pct">–%</span>
  <div id="grip">⋮</div>
</div>
<script src="percent.js"></script>
<script>
const $ = s => document.querySelector(s);
const id = window.pulse.widgetId;
let cfg = null, usage = null, settings = null;
let hovering = false;

const colorFor = p => p >= 90 ? '#ef4444' : p >= 70 ? '#f59e0b' : '#3b82f6';
const mode = () => PulsePercent.normalize(settings && settings.percentMode);

function myLimit() {
  return usage && usage.limits ? usage.limits.find(l => l.kind === (cfg && cfg.kind)) : null;
}

function fmtReset(iso) {
  if (!iso) return '';
  const d = new Date(iso), ms = d - Date.now();
  if (ms <= 0) return 'resetting…';
  const h = ms / 36e5;
  if (h < 24) { const total = Math.ceil(ms / 60000), H = Math.floor(total / 60), M = total % 60; return H ? `${H}h ${M}m left` : `${M}m left`; }
  return 'resets ' + d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
}

function render(showReset) {
  const l = myLimit();
  const codex = cfg && cfg.kind.startsWith('codex:');
  $('#pill').classList.toggle('codex', !!codex);
  $('#provider').textContent = codex ? 'CODEX' : 'CLAUDE';
  $('#topBadge').style.display = cfg && cfg.top ? 'block' : 'none';
  if (!l) { $('#label').textContent = 'unavailable'; $('#pct').textContent = '\u2014'; $('#fill').style.width = '0%'; return; }
  const provider = usage.providers && usage.providers[codex ? 'codex' : 'claude'];
  const stale = provider && provider.status !== 'ok';
  $('#pill').title = `${l.label} \u00b7 ${PulsePercent.text(l, mode())} \u00b7 ${fmtReset(l.resets_at)}${stale ? ' \u00b7 Stale: ' + provider.status : ''}`;
  $('#label').textContent = showReset ? fmtReset(l.resets_at) : codex ? l.label.replace('GPT-5.3-Codex-Spark', 'Spark').replace('gpt-reserve', 'Reserve').replace(/ limit$/, '') : l.label;
  $('#pct').textContent = (stale ? '~' : '') + PulsePercent.text(l, mode(), true);
  $('#fill').style.width = PulsePercent.bar(l, mode()) + '%';
  $('#fill').style.background = codex && l.percent < 70 ? '#2dd4bf' : colorFor(l.percent);
  $('#pct').style.color = l.percent >= 90 ? '#f87171' : '#fff';
  $('#topBadge').style.display = cfg && cfg.top ? 'block' : 'none';
}

/* hover → show countdown */
$('#pill').addEventListener('mouseenter', () => { hovering = true; render(true); });
$('#pill').addEventListener('mouseleave', () => { hovering = false; render(false); });

/* interactions */
let drag = null;
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerdown', async e => {
  if (!settings || !cfg) return;
  if (e.button === settings.bindDelete) {
    e.preventDefault();
    window.pulse.widgetClose(id);
    return;
  }
  if (e.button === settings.bindDrag) {
    e.preventDefault();
    const target = e.target;
    target.setPointerCapture(e.pointerId);
    const b = await window.pulse.widgetBoundsGet(id);
    if (!target.hasPointerCapture(e.pointerId)) return;
    if (!b) return;
    const mode = (window.innerWidth - e.clientX) < 18 ? 'resize' : 'move';
    drag = { sx: e.screenX, sy: e.screenY, b, mode };

  }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.screenX - drag.sx, dy = e.screenY - drag.sy;
  if (drag.mode === 'move') window.pulse.widgetBoundsSet({ id, x: drag.b.x + dx, y: drag.b.y + dy });
  else window.pulse.widgetBoundsSet({ id, w: drag.b.width + dx });
});
function endDrag() { if (drag) { drag = null; window.pulse.widgetDragEnd(id); } }
for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) document.addEventListener(event, endDrag);
/* block middle-click autoscroll */
document.addEventListener('auxclick', e => e.preventDefault());

window.pulse.onUsage(u => { usage = u; render(false); });
window.pulse.onSettings(s => { settings = s; render(hovering); });
window.pulse.onWidgets(ws => { const w = ws.find(x => x.id === id); if (w) { cfg = w; render(false); } });

(async () => {
  const r = await window.pulse.widgetConfig(id);
  cfg = r.widget; settings = r.settings; usage = r.usage;
  render(false);
  setInterval(() => render(hovering), 30000);
})();
</script>
</body>
</html>
