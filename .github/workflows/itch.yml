name: publish to itch.io

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run pack

      - name: Download butler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler

      - name: Push build to itch.io
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: .\butler\butler.exe push "dist\ClaudePulse-win32-x64" formslip/claude-pulse:windows --userversion "1.0.${{ github.run_number }}"
