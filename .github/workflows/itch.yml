name: publish to itch.io

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            channel: windows
            butler_dl: windows-amd64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            channel: linux
            butler_dl: linux-amd64
          - os: macos-latest
            platform: darwin
            arch: universal
            channel: mac
            butler_dl: darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - shell: bash
        run: npx electron-packager . ClaudePulse --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --icon claudepulse --out dist --overwrite --ignore "^/dist$" --ignore "^/data$" --ignore "^/test-pulse\.js$"

      - name: Download butler (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler

      - name: Download butler (mac/linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -L -o butler.zip "https://broth.itch.zone/butler/${{ matrix.butler_dl }}/LATEST/archive/default"
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V

      - name: Push build to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler/butler${{ runner.os == 'Windows' && '.exe' || '' }} push "dist/ClaudePulse-${{ matrix.platform }}-${{ matrix.arch }}" formslip/claude-pulse:${{ matrix.channel }} --userversion "1.0.${{ github.run_number }}"
